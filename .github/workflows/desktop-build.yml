name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_path: release/*.exe
            artifact_name: mnetto-windows
          - os: macos-latest
            artifact_path: release/*.zip
            artifact_name: mnetto-macos
          - os: ubuntu-latest
            artifact_path: release/*.AppImage
            artifact_name: mnetto-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Only used at build time to inline values into the Vite bundle —
      # the Supabase anon key is safe to expose in the shipped app (see README).
      - name: Write .env
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      - name: Build installer
        run: npm run dist
        env:
          # electron-builder tries to auto-publish to GitHub Releases unless told not to.
          # This keeps it to a plain local build; the upload step below handles distribution.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
