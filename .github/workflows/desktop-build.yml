name: Build Desktop Apps

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_path: release/*.exe
            artifact_name: mnetto-windows
          - os: macos-latest
            artifact_path: release/*.zip
            artifact_name: mnetto-macos
          - os: ubuntu-latest
            artifact_path: release/*.AppImage
            artifact_name: mnetto-linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      # Only used at build time to inline values into the Vite bundle —
      # the Supabase anon key is safe to expose in the shipped app (see README).
      - name: Write .env
        shell: bash
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" > .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      # Plain push to main = test build only, nothing published.
      # Pushing a version tag (e.g. "v0.1.2") = real GitHub Release, including
      # the latest.yml/latest-mac.yml feed files electron-updater checks for
      # auto-updates. Untagged pushes never create a public release.
      - name: Build (and publish on version tags)
        run: npm run build && npx electron-builder --publish ${{ startsWith(github.ref, 'refs/tags/v') && 'always' || 'never' }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: warn
